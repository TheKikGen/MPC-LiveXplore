name: Générer l'Index et le Menu du Wiki

on:
  gollum:
  workflow_dispatch:

jobs:
  update-wiki-index:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout du depot principal
        uses: actions/checkout@v4

      - name: Cloner le wiki
        run: git clone "https://oauth2:${{ secrets.GITHUB_TOKEN }}@://github.com{{ github.repository }}.wiki.git" wiki-dir

      - name: Executer le script de generation
        run: |
          chmod +x generate-wiki.sh
          ./generate-wiki.sh

      - name: Commit et Push des modifications
        run: |
          cd wiki-dir
          git config user.name "github-actions-bot"
          git config user.email "github-actions-bot@users.noreply.github.com"
          git add Home.md _Sidebar.md
          if git diff --cached --quiet; then
            echo "Aucun changement détecté."
          else
            git commit -m "Automatique: Mise a jour de la page d-accueil et du menu du Wiki"
            git push origin HEAD
          fi
