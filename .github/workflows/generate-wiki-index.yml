name: Générer l'Index du Wiki

on:
  gollum:
  workflow_dispatch:

jobs:
  update-wiki-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Récupérer l'arborescence du Wiki
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Scanner les fichiers et générer l'index
        shell: python
        run: |
          import os

          # 1. Lister tous les fichiers Markdown du wiki
          files = [f for f in os.listdir('.') if f.endswith('.md')]
          
          # 2. Exclure les pages spéciales du système de navigation
          excluded = ['Home.md', '_Sidebar.md', '_Footer.md']
          articles = [f for f in files if f not in excluded]
          
          # 3. Trier les articles par ordre alphabétique
          articles.sort()

          # 4. Construire le contenu de la nouvelle page d'accueil
          markdown = []
          markdown.append("# 🧭 Index Automatique des Articles\n")
          markdown.append("Voici la liste de toutes les pages disponibles sur ce Wiki :\n")

          for file in articles:
              title = file[:-3]  # Supprime l'extension '.md'
              url_name = title.replace(' ', '-')  # Format d'URL de GitHub
              markdown.append(f"* [{title}]({url_name})")

          # 5. Écrire le résultat dans Home.md
          with open("Home.md", "w", encoding="utf-8") as f:
              f.write("\n".join(markdown))
          
          print(f"Index généré avec succès ! {len(articles)} articles trouvés.")

      - name: Pousser les modifications sur le Wiki
        run: |
          git config user.name "github-actions-bot"
          git config user.email "github-actions-bot@users.noreply.github.com"
          git add Home.md
          if git diff --cached --quiet; then
            echo "Aucun changement détecté."
          else
            git commit -m "Automatique: Mise a jour de la page d-accueil"
            git push origin HEAD
          fi
